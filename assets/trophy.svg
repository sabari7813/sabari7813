<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180">
  <rect width="960" height="180" fill="#0d1117"/>
  <style>
    .card{fill:#111827;stroke:#238636;stroke-width:2}
